[project]
name = "active-log-automation"
version = "0.1.0"
description = "Active Log 티스토리 비공개 초안 자동 생성기"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "openai>=1.100,<3",
  "playwright>=1.50,<2",
  "PySide6>=6.8,<7",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
active-log = "active_log.main:run"
active-log-desktop = "active_log.desktop:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["active_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
